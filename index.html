<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<link rel="apple-touch-icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Lift &amp; Fuel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift & Fuel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column of white cards on warm grey, fixed tab bar at the bottom. Single light look, matched to the mockups. */
:root{
  /* base: cool neutrals */
  --bg:#F2F4F7; --card:#FFFFFF; --ink:#101828; --muted:#5D6679; --soft:#98A2B3;
  --line:#E4E7EC; --chip:#EEF1F5; --track:#E4E7EC; --on-dark:#A6AEBF;
  /* one accent for actions and highlights */
  --accent:#FF7A1A; --accent-ink:#1A0E00; --accent-t:#FFE9D6;
  /* one color per metric, each with a tinted track and a text-safe shade */
  --cal:#3366FF; --cal-t:#E0E8FF; --cal-text:#2A55DB;
  --protein:#E0457B; --protein-t:#FBE3EC; --protein-text:#C22F64;
  --steps:#0E9F78; --steps-t:#D7F2E9; --steps-text:#0B7A5D;
  --water:#06AED4; --water-t:#D5F4FA;
  --workout:#7A5AF8; --workout-text:#6544EE;
  --danger:#D92D20; --danger-t:#FDE3E1;
  --font:"Plus Jakarta Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:26px; --r-pill:999px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding-top:28px;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}

.banner{background:var(--accent-t);border-radius:16px;padding:12px 14px;font-size:14px;color:#5A4410}
.head{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.eyebrow{color:var(--muted);font-size:15px}
h1{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
.datenav{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.datenav button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:18px;line-height:1}
.datenav button:active{background:var(--line)}
.linkbtn{font-weight:700;font-size:15px;color:var(--ink)}
.backtoday{font-size:13px;font-weight:700;background:var(--card);border-radius:var(--r-pill);padding:4px 10px;margin-left:4px}

.card{background:var(--card);border-radius:var(--r-card);padding:22px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.card.dark{background:var(--ink);color:#fff}
.label{color:var(--muted);font-size:15px;font-weight:500}
.k::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--kc)}
.k-cal{--kc:var(--cal)}.k-pro{--kc:var(--protein)}.k-steps{--kc:var(--steps)}.k-wo{--kc:var(--workout)}.k-water{--kc:var(--water)}
.t-steps{color:var(--steps-text)!important}.t-wo{color:var(--workout-text)!important}.t-pro{color:var(--protein-text)!important}
.dark .label{color:var(--on-dark)}
.rb{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bignum.md{font-size:42px}
.of{color:var(--muted);font-size:17px}
.bar{height:11px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.bar.cal{background:var(--cal-t)}.bar.cal i{background:var(--cal)}
.bar.steps{background:var(--steps-t)}.bar.steps i{background:var(--steps)}
.bar.pro{background:var(--protein-t)}
.bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--ink);transition:width .4s}

.bar.over{background:var(--danger-t)}.bar.over i{background:var(--danger)}
.small{font-size:15px;color:var(--muted)}
.small b{color:var(--ink)}
.over-t{color:var(--danger)!important}
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:14px}
.ledger div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ledger span{font-size:13px;color:var(--muted)}
.ledger b{font-size:18px;font-weight:700}
.edithint{font-size:13px;font-weight:700;color:var(--muted)}
.card-btn:active{transform:scale(.99)}

.plan-title{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dark .sub{color:var(--on-dark);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-pill);font-weight:800;font-size:18px;padding:14px 26px;min-height:52px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.btn.plain{background:var(--card);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);font-size:15px;min-height:44px;padding:10px 16px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.done-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,122,26,.16);color:var(--accent);border-radius:var(--r-pill);padding:6px 12px;font-weight:700;font-size:14px;align-self:flex-start}

.list{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow:first-child{border-top:0;padding-top:4px}
.lrow .name{font-size:17px;min-width:0;overflow-wrap:anywhere}
.lrow .val{font-size:17px;font-weight:700;white-space:nowrap}
.lrow.sub{padding:8px 0 8px 12px;border-top:0}
.lrow.sub .name,.lrow.sub .val{font-size:15px;color:var(--muted);font-weight:500}
.lrow.sub .meta{font-size:12px;color:var(--soft)}
.empty{color:var(--muted);font-size:15px;padding:4px 0}

/* plan */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border-radius:var(--r-pill);padding:9px 15px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chip.add{background:transparent;border:1.5px dashed var(--soft)}
.h1input{font-size:34px;font-weight:800;letter-spacing:-.02em;border:0;background:transparent;width:100%;padding:2px 0;border-radius:8px;min-width:0}
.h1input:focus{outline:none;background:rgba(0,0,0,.04)}
.days{display:flex;justify-content:space-between;gap:6px}
.day{width:44px;height:44px;border-radius:50%;background:var(--card);font-weight:700;font-size:16px;flex:none;color:var(--muted)}
.day.on{background:var(--ink);color:#fff}
.ex{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0;padding-top:2px}
.ex:last-child{padding-bottom:2px}
.ex-top{display:flex;gap:8px;align-items:center}
.ex-name{flex:1;min-width:0;border:0;font-weight:800;font-size:18px;padding:4px 0;background:transparent;border-radius:6px}
.ex-name:focus{outline:none;background:var(--chip)}
.ex-name::placeholder{color:var(--soft);font-weight:600}
.x{width:32px;height:32px;border-radius:50%;color:var(--soft);font-size:22px;line-height:1;flex:none}
.x:active{background:var(--chip)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:baseline;gap:5px;background:var(--chip);border-radius:12px;padding:9px 13px;font-size:16px;color:var(--muted);cursor:text}
.pill input{border:0;background:transparent;font-weight:600;color:var(--ink);text-align:right;padding:0;min-width:1.4ch;font-variant-numeric:tabular-nums;font-size:16px}
.pill input:focus{outline:none}
.pill:focus-within{box-shadow:0 0 0 2px var(--ink)}
.pill input::placeholder{color:var(--soft)}
.dashed{border:2px dashed var(--soft);border-radius:var(--r-card);padding:16px;font-weight:800;font-size:18px;width:100%}
.quiet-actions{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}

/* log */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:24px;font-weight:800}
.stats span{font-size:13px;color:var(--muted)}
.sess .t{font-weight:800;font-size:18px}
.tag{background:var(--chip);border-radius:var(--r-pill);padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.exsum{font-size:14px;color:var(--muted);line-height:1.5}
.dategroup{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:8px 4px -4px}

/* progress */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.seg button{background:var(--chip);border-radius:var(--r-pill);padding:13px 6px;font-weight:600;font-size:16px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.seg.sm button{padding:8px 4px;font-size:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart-foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px}
.chart-foot .a{color:var(--muted)}
.chart-foot .c{font-size:13px;font-weight:700;color:var(--muted)}
.chart-foot .b{font-weight:800}
.section-label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:10px 4px -2px}
.note{font-size:13px;color:var(--muted);line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:10px 0 12px;font-size:17px;color:var(--muted);font-weight:500;position:relative}
.tab.on{color:var(--ink);font-weight:800}
.tab.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:4px;border-radius:4px;background:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.45);animation:fade .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.panel-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--soft);margin:0 auto 4px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;font-weight:600;color:var(--muted)}
.in{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;font-size:17px;width:100%;min-width:0}
.in:focus{outline:none;border-color:var(--ink)}
.in.bigin{font-size:30px;font-weight:800;padding:12px 15px}
textarea.in{min-height:90px;resize:vertical;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:14px;color:var(--muted)}
.hint b{color:var(--ink)}
.est{align-self:flex-start;font-size:14px;font-weight:700;background:var(--card);border-radius:var(--r-pill);padding:7px 12px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.sheet-actions{display:flex;flex-direction:column;gap:6px;margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:var(--r-pill);font-weight:700;font-size:15px;z-index:60;white-space:nowrap}
.pg{font-size:13px;color:var(--soft);font-weight:600;margin-left:8px}
.bar.pro i{background:var(--protein)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip.mine{background:var(--ink);color:#fff}
.chip.mine span{opacity:.7;font-weight:500;margin-left:4px}
.advice{background:var(--chip);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.45}
.stats.six{row-gap:14px}
.bar.water{background:var(--water-t)}.bar.water i{background:var(--water)}
.wbtn{flex:1;min-height:44px;border-radius:14px;background:var(--water-t);color:#055E73;font-weight:800;font-size:15px}
.wbtn.undo{flex:none;padding:0 14px;background:var(--chip);color:var(--muted);font-weight:700}
.stall{background:var(--accent-t);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#7A3A00}
.stalltag{align-self:center;background:var(--accent-t);color:#9A4A00;border-radius:var(--r-pill);padding:6px 11px;font-weight:700;font-size:13px}
.nudge{flex-direction:row;align-items:center;gap:12px;background:var(--accent-t);padding:16px 18px}
.nudge div{flex:1;min-width:0;font-size:15px;line-height:1.4}
.src{font-size:12px;color:var(--soft);font-weight:500}
.rec{border-radius:14px;padding:11px 13px;background:var(--cal-t);display:flex;flex-direction:column;gap:3px}
.rec-up{background:var(--accent-t)}.rec-down{background:var(--danger-t)}.rec-start{background:var(--chip)}.rec-stall{background:var(--accent-t)}
.rec-h{font-size:15px;line-height:1.35}.rec-h b{font-weight:800}
.rec-why{font-size:13px;color:var(--muted);line-height:1.45}
.nextline{font-size:13px;color:var(--muted)}.nextline b{color:var(--ink)}
/* workout mode */
#wo{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.wo-head{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.wo-head-in{max-width:460px;margin:0 auto 10px;display:grid;grid-template-columns:72px 1fr 92px;align-items:center;gap:8px}
.wo-title{display:flex;flex-direction:column;align-items:center;min-width:0}
.wo-title b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wo-title span{font-size:14px;color:var(--muted)}
.bar.thin i{background:var(--accent)}
.bar.thin{background:var(--accent-t);height:6px;max-width:460px;margin:0 auto}
.btn.sm{min-height:40px;padding:8px 14px;font-size:16px}
.wo-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:6px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.wo-in.fin{padding-top:calc(28px + env(safe-area-inset-top,0px))}
.wo-ex.complete{opacity:.55}
.wo-exname{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.grp-tag{background:var(--ink);color:#fff;border-radius:8px;font-size:12px;font-weight:800;padding:3px 7px;flex:none}
.last{font-size:14px;font-weight:700;color:var(--workout-text)}
.moveup{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-pill);padding:6px 11px;font-weight:700;font-size:13px}
.bands{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bchip{min-width:42px;height:36px;padding:0 9px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px;color:var(--muted)}
.bchip.on{background:var(--ink);color:#fff}
.btot{font-size:14px;font-weight:700;margin-left:4px;white-space:nowrap}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto 48px;align-items:center;gap:10px}
.setn{font-size:14px;font-weight:700;color:var(--muted)}
.setin{padding:10px 12px;font-size:18px;font-weight:700}
.tick{width:48px;height:48px;border-radius:50%;background:var(--chip);font-size:20px;font-weight:800;color:var(--soft)}
.setrow.done .tick{background:var(--steps);color:#fff}
.setrow.done .setin{background:var(--chip)}
.linkbtn.sm{font-size:14px}.linkbtn.muted{color:var(--muted)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.restbar-in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:8px}
.restbar-in span{font-size:14px;color:var(--on-dark)}
.restbar-in b{font-size:26px;font-weight:800;margin-right:auto}
.restbar button{background:rgba(255,255,255,.12);border-radius:var(--r-pill);padding:9px 13px;font-weight:700;font-size:15px;color:#fff}
.restbar .skip{background:var(--accent);color:var(--accent-ink)}
.grp{width:3.4ch;border:0;background:var(--chip);border-radius:8px;text-align:center;font-weight:800;font-size:13px;padding:6px 0;flex:none}
.grp:focus{outline:2px solid var(--ink)}
.ex-note{border:0;background:transparent;font-size:14px;color:var(--muted);padding:2px 0;width:100%;min-width:0}
.ex-note:focus{outline:none;background:var(--chip)}
.x.mv{font-size:16px;width:28px}
.x[disabled]{opacity:.25}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.bignum{font-size:44px}.day{width:38px;height:38px}h1,.h1input{font-size:30px}}
</style>

</head>
<body>
<div class="wrap" id="view"></div>
<div class="tabbar"><nav id="tabs">
  <button class="tab" data-tab="today">Today</button>
  <button class="tab" data-tab="plan">Plan</button>
  <button class="tab" data-tab="log">Log</button>
  <button class="tab" data-tab="progress">Progress</button>
</nav></div>
<div id="wo" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dkey(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const num=(v,def=0)=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:def};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const fmt1=n=>(Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const signed=n=>(n>0?'−':'')+fmt(Math.abs(n));
const neg=n=>n<0?'−'+fmt(-n):fmt(n);

const dayData=k=>S.days[k]||{foods:[],steps:0};
const ensureDay=k=>(S.days[k]||=(S.days[k]={foods:[],steps:0}));
function calc(k){const d=dayData(k),st=S.settings;
  const h=d.health||{};

  const protein=d.foods.reduce((a,f)=>a+num(f.protein),0)+num(h.protein);
  const steps=num(d.steps);
  const stepKcal=Math.round(steps*num(st.kcalPerStep));
  const raw=S.sessions.filter(s=>s.date===k).reduce((a,s)=>a+num(s.kcal),0);
  const workoutKcal=Math.round(raw*num(st.workoutPct,100)/100);
  const net=food-stepKcal-workoutKcal;
  return{food,protein,steps,stepKcal,workoutKcal,net,target:num(st.calTarget),left:num(st.calTarget)-net}}
const sortedWeights=()=>[...S.weights].sort((a,b)=>a.date<b.date?-1:1);
const OZ=29.5735;
const wUnit=()=>S.settings.waterUnit==='oz'?'oz':'ml';
const toUnit=ml=>wUnit()==='oz'?ml/OZ:ml;
const fromUnit=v=>wUnit()==='oz'?v*OZ:v;
const fmtWater=ml=>fmt(toUnit(ml))+' '+wUnit();
const waterTotal=d=>(d.water||[]).reduce((a,b)=>a+num(b),0);
const waterSteps=()=>wUnit()==='oz'?[8,16,24]:[250,500,750];
const timeStr=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
function backupNudge(isToday){if(!isToday)return'';
  const has=S.sessions.length||S.weights.length||Object.keys(S.days).length;if(!has)return'';
  const since=S.lastBackup||S.createdAt||Date.now(),days=Math.floor((Date.now()-since)/864e5);if(days<7)return'';
  return `<section class="card nudge"><div>${S.lastBackup?`It's been <b>${days} days</b> since your last backup.`:'You haven\'t backed up yet.'} Copy one into Notes so your history is safe.</div><button class="btn accent sm" data-act="backup">Copy backup</button></section>`}
function withTrend(all){return all.map(w=>{const from=addDays(w.date,-6);const win=all.filter(x=>x.date>=from&&x.date<=w.date);return{...w,trend:win.reduce((a,x)=>a+num(x.lbs),0)/win.length}})}
function weightRate(){const w=sortedWeights().filter(x=>x.date>=addDays(todayKey(),-21));if(w.length<4)return null;
  const xs=w.map(x=>parseKey(x.date).getTime()/864e5),ys=w.map(x=>num(x.lbs));if(xs[xs.length-1]-xs[0]<10)return null;
  const mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let n=0,dd=0;xs.forEach((x,i)=>{n+=(x-mx)*(ys[i]-my);dd+=(x-mx)**2});return dd?n/dd*7:null}
function weekly(){const t=todayKey(),days=[];for(let i=7;i>=1;i--)days.push(addDays(t,-i));
  const fd=days.filter(k=>dayData(k).foods.length||dayData(k).health),cs=fd.map(calc);
  const sd=days.filter(k=>num(dayData(k).steps)>0);
  return{days,foodDays:fd.length,
    avgNet:cs.length?cs.reduce((a,c)=>a+c.net,0)/cs.length:null,
    avgPro:cs.length?cs.reduce((a,c)=>a+c.protein,0)/cs.length:null,
    avgSteps:sd.length?sd.reduce((a,k)=>a+num(dayData(k).steps),0)/sd.length:null,
    workouts:S.sessions.filter(x=>x.date>=days[0]&&x.date<=days[6]).length,rate:weightRate()}}
function advice(w){const st=S.settings,T=num(st.calTarget),r=w.rate,ch=v=>(v<0?'down ':'up ')+fmt1(Math.abs(v))+' lbs a week';
  if(w.foodDays<5)return{msg:`You logged food on ${w.foodDays} of the last 7 days. Log at least 5 days for a reliable read before changing anything.`};
  if(w.avgNet>T+150)return{msg:`Your net averaged ${fmt(w.avgNet-T)} kcal over target. Try hitting your target for a week before changing it.`};
  if(r==null)return{msg:'Weigh in at least 4 mornings across 10 or more days to see how fast your weight is moving.'};
  if(st.goal==='lose'){
    if(r<-1)return{msg:`You're ${ch(r)}. That's fast for building muscle, so eating a little more should help your lifts.`,act:100};
    if(r<=-0.4)return{msg:`You're ${ch(r)}. Right where it should be for a recomp. Keep your target.`};
    return{msg:`Your weight is ${Math.abs(r)<0.15?'flat':ch(r)}. If your waist isn't shrinking either, lower your target a little.`,act:-100}}
  if(st.goal==='gain'){
    if(r<0.15)return{msg:`Your weight is ${Math.abs(r)<0.15?'flat':ch(r)}. To gain, eat a little more.`,act:100};
    if(r>0.75)return{msg:`You're ${ch(r)}, faster than needed. Ease off a little to limit fat gain.`,act:-100};
    return{msg:`You're ${ch(r)}. A steady gain. Keep your target.`}}
  if(r<-0.5)return{msg:`You're ${ch(r)} while maintaining. Eat a little more.`,act:100};
  if(r>0.5)return{msg:`You're ${ch(r)} while maintaining. Eat a little less.`,act:-100};
  return{msg:`Your weight is steady. Keep your target.`}}
function checkinCard(){const w=weekly(),a=advice(w),T=num(S.settings.calTarget),sh={month:'short',day:'numeric'};
  return `<section class="card" id="checkin"><div class="rb"><span class="label">Weekly check-in</span><span class="small">${dayLabel(w.days[0],sh)} – ${dayLabel(w.days[6],sh)}</span></div>

const latestWeight=()=>{const w=sortedWeights();return w.length?w[w.length-1]:null};
const routineSets=r=>r.exercises.reduce((a,e)=>a+num(e.sets),0);
const estMinutes=r=>Math.round(routineSets(r)*2.5/5)*5;
const BANDS=[10,20,30,40,50];
const bandTotal=e=>(e.band||[]).reduce((a,b)=>a+num(b),0);
const bandLabel=e=>e.bw?'bodyweight':bandTotal(e)?bandTotal(e)+' lbs':(num(e.weight)?num(e.weight)+' lbs':'');
const topRep=r=>{const m=String(r??'').match(/(\d+)\D*$/);return m?+m[1]:null};
const clock=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
function lastFor(name){const n=(name||'').trim().toLowerCase();if(!n)return null;
  const ss=[...S.sessions].sort((a,b)=>a.date===b.date?(b.created||0)-(a.created||0):(a.date<b.date?1:-1));
  for(const x of ss){const e=(x.exercises||[]).find(y=>(y.name||'').trim().toLowerCase()===n);if(e)return e}return null}
function historyFor(name,n){const k=(name||'').trim().toLowerCase(),out=[];if(!k)return out;
  const ss=[...S.sessions].sort((a,b)=>a.date===b.date?(b.created||0)-(a.created||0):(a.date<b.date?1:-1));
  for(const x of ss){const e=(x.exercises||[]).find(y=>(y.name||'').trim().toLowerCase()===k);if(e&&e.log&&e.log.length){out.push(e);if(out.length>=n)break}}return out}
const exScore=e=>e.log.reduce((a,x)=>a+num(x.reps),0)*(e.bw?1:Math.max(1,bandTotal(e)||num(e.weight)));
function isStalled(ex){if(readyToMoveUp(ex))return false;const h=historyFor(ex.name,3);if(h.length<3)return false;
  const[c,b,a]=h;return exScore(b)<=exScore(a)&&exScore(c)<=exScore(a)}
const START_BANDS=[[/single-arm|split squat|lunge/,20],[/lateral|rear delt|bayesian|high-anchor|pallof/,10],[/overhead press|incline|triceps|pushdown|face pull|curl|hammer|crunch/,20],[/chest press|pulldown|good morning/,30],[/row/,40],[/squat|romanian|calf/,50],[/deadlift|shrug/,60]];
const startBand=n=>{n=(n||'').toLowerCase();for(const[re,v]of START_BANDS)if(re.test(n))return v;return 20};
function repRange(r){const m=String(r??'').match(/\d+/g);if(!m)return null;const lo=+m[0],hi=+m[m.length-1];return{lo,hi,txt:lo===hi?`${lo}`:`${lo}–${hi}`}}
function combo(t){let best=null;for(let m=1;m<32;m++){const pick=BANDS.filter((_,i)=>m>>i&1);if(pick.reduce((a,b)=>a+b,0)===t&&(!best||pick.length<best.length))best=pick}return best}
function recommend(ex){
  const sets=Math.max(1,num(ex.sets)),rr=repRange(ex.reps),h=historyFor(ex.name,1)[0];
  const last=h?h.log.map(x=>num(x.reps)):[],plusOne=cap=>Array.from({length:sets},(_,i)=>{const r=(last[i]??last[last.length-1])+1;return cap?Math.min(cap,r):r});
  if(ex.bw){
    if(!h)return{bw:true,kind:'start',aim:[],why:'Bodyweight. Stop 1–2 reps short of failure and log what you got.'};
    if(!rr&&Math.min(...last)>=20)return{bw:true,kind:'up',aim:plusOne(),why:'20+ reps on every set. Make it harder: put a 10 lb band across your back, or slow each rep to 3 seconds down.'};
    return{bw:true,kind:'same',aim:plusOne(rr&&rr.hi),why:'Beat last time by one rep per set.'}}
  let r;
  if(!h){const t=bandTotal(ex)||startBand(ex.name);
    r={total:t,kind:'start',aim:rr?Array(sets).fill(rr.lo):[],why:bandTotal(ex)?'Your planned bands. If the last 2 reps of the first set feel easy, add 10 lbs for the next set.':'A starting guess for this exercise. If the last 2 reps of the first set feel easy, add 10 lbs for the next set. If you can\'t reach the bottom of the range, drop 10.'}}
  else{const lt=bandTotal(h)||num(h.weight)||startBand(ex.name);
    if(!rr)r={total:lt,kind:'same',aim:plusOne(),why:'Same bands. Beat last time by one rep per set.'};
    else if(last.length>=sets&&last.every(x=>x>=rr.hi)){const big=10/lt>=.4;
      r={total:lt+10,kind:'up',aim:Array(sets).fill(rr.lo),why:`You hit ${rr.hi}+ on every set last time. Move up 10 lbs and start back at ${rr.lo} reps.`+(big?` That's a big jump for this exercise. If you can't reach ${rr.lo}, go back to ${lt} lbs and stand a step farther from the anchor for more tension.`:'')}}
    else{const avg=last.reduce((a,b)=>a+b,0)/last.length;
      if(avg<rr.lo-2&&lt>10)r={total:lt-10,kind:'down',aim:Array(sets).fill(rr.lo),why:`Last time averaged ${fmt1(avg)} reps, under the ${rr.txt} range. Drop 10 lbs and build back up.`};
      else if(isStalled(ex))r={total:lt,kind:'stall',aim:plusOne(rr.hi),why:'No progress in 3 sessions. Keep the same bands but lower each rep over 3 seconds. Harder without adding weight.'};
      else r={total:lt,kind:'same',aim:plusOne(rr.hi),why:`Same bands. Add one rep per set until you hit ${rr.hi} on all ${sets}.`}}}
  if(r.total>150){r.total=150;r.why+=' That\'s every band clipped together, so also slow the lowering to 3 seconds.'}
  r.combo=combo(r.total);return r}
function recLabel(r){return r.bw?'Bodyweight':`${r.total} lbs${r.combo&&r.combo.length>1?` (clip ${r.combo.join(' + ')})`:''}`}
function recBox(r){return `<div class="rec rec-${r.kind}"><div class="rec-h">Today: <b>${recLabel(r)}</b>${r.aim&&r.aim.length?` · aim for <b class="num">${r.aim.join(' / ')}</b> reps`:''}</div><div class="rec-why">${r.why}</div></div>`}
function recLine(e){if(!e.name.trim())return'';const r=recommend(e);return `Next session: <b>${recLabel(r)}</b>${r.aim&&r.aim.length?` · aim ${r.aim.join(' / ')}`:''}`}

function bandChips(e,act,attrs){return `<div class="bands"><button class="bchip${e.bw?' on':''}" data-act="${act}" ${attrs} data-b="bw" aria-pressed="${e.bw}">BW</button>${BANDS.map(b=>{const on=!e.bw&&e.band.includes(b);return `<button class="bchip${on?' on':''}" data-act="${act}" ${attrs} data-b="${b}" aria-pressed="${on}">${b}</button>`}).join('')}<span class="btot num">${e.bw?'Bodyweight':bandTotal(e)?bandTotal(e)+' lbs':'Pick bands'}</span></div>`}

}

function renderToday(){
  const k=viewDate,c=calc(k),isToday=k===todayKey();
  const budget=c.target+c.stepKcal+c.workoutKcal;
  const pct=budget>0?Math.max(0,Math.min(100,c.food/budget*100)):0;
  const over=c.left<0;

  const d=dayData(k),st=S.settings;
  const stepPct=st.stepTarget>0?Math.min(100,c.steps/st.stepTarget*100):0;

  const planned=S.routines.filter(r=>r.days.includes(wd));

        <button class="btn ghost" style="align-self:flex-start" data-act="edit-session" data-id="${done.id}">View session</button>`
        :`<button class="btn accent" style="align-self:flex-start" data-act="start-wo" data-id="${r.id}">Start workout</button>`}

  if(!planned.length){
    plannedHtml=`<section class="card dark">
      <div class="label">${isToday?'Planned today':'Planned'}</div>
      <div class="plan-title">Rest day</div>
      <div class="sub">${S.routines.length?'No routine is set for this weekday.':'Build a routine in Plan and pick its training days.'}</div>
      <div class="btnrow">${S.routines.length?'<button class="btn accent" data-act="pick-start">Start a routine</button>':''}<button class="btn ghost" data-act="new-session">Log manually</button></div>
    </section>`}
  const extra=sessions.filter(s=>!plannedIds.has(s.routineId));

    extra.map(s=>`<button class="lrow" data-act="edit-session" data-id="${s.id}"><span class="name">${esc(s.name||'Workout')}</span><span class="val num">${fmt(num(s.kcal))} kcal</span></button>`).join('')}</div></section>`}

  const pg=v=>num(v)?`<span class="pg t-pro">${fmt(num(v))} g</span>`:'';
  const groups=MEALS.map(m=>{const items=d.foods.filter(f=>(f.meal||'Snack')===m);if(!items.length)return'';

function chartSVG(pts){
  const W=320,H=130,pl=10,pr=14,pt=14,pb=12;
  const t0=parseKey(pts[0].date).getTime(),t1=parseKey(pts[pts.length-1].date).getTime();
  const vs=pts.flatMap(p=>[num(p.lbs),p.trend]);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi-lo<2){const m=(hi+lo)/2;lo=m-1;hi=m+1}
  const x=t=>pl+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-pl-pr);
  const y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const xy=pts.map(p=>[x(parseKey(p.date).getTime()),y(p.trend)]);
  const d=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const last=xy[xy.length-1];
  const grid=[0,0.5,1].map(f=>{const yy=pt+f*(H-pt-pb);return `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#E4E7EC" stroke-width="1"/>`}).join('');
  const dots=pts.map(p=>`<circle cx="${x(parseKey(p.date).getTime()).toFixed(1)}" cy="${y(num(p.lbs)).toFixed(1)}" r="2.6" fill="#98A2B3"/>`).join('');
  const area=d+` L${last[0].toFixed(1)} ${H-pb} L${xy[0][0].toFixed(1)} ${H-pb} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${fmt1(pts[0].trend)} to ${fmt1(pts[pts.length-1].trend)} pounds">${grid}
    <path d="${area}" fill="#3366FF" fill-opacity=".10"/>${dots}
    <path d="${d}" fill="none" stroke="#3366FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="7" fill="#FF7A1A" stroke="#FFFFFF" stroke-width="3"/></svg>`;
}

function startWorkout(rid){
  if(!$('#sheet').hidden)closeSheet();
  if(S.active){woOpen=true;renderWO();toast('Finish or discard the current workout first');return}
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  S.active={routineId:r.id,name:r.name||'Workout',date:viewDate,startedAt:Date.now(),restEnd:null,

function renderWO(){

  }

function tickWO(){
  if(!S.active||!woOpen){clearInterval(woTick);woTick=null;return}
  const t=$('#wo-time');if(t)t.textContent=clock(Date.now()-S.active.startedAt);
  const rb=$('#restbar');if(!rb)return;
  const left=S.active.restEnd?Math.ceil((S.active.restEnd-Date.now())/1000):0;
  if(left>0){rb.hidden=false;$('#rest-t').textContent=clock(left*1000)}
  else if(S.active.restEnd){rb.hidden=true;S.active.restEnd=null;save();beep()}
  else rb.hidden=true;

      else if(parts.length===1&&num(e.sets)>0)e.log=Array.from({length:num(e.sets)},()=>({reps:num(parts[0])}));else e.log=[]});
    if(s.id){const i=S.sessions.findIndex(x=>x.id===s.id);S.sessions[i]=s}else{s.id=uid();s.created=Date.now();S.sessions.push(s)}
    if(ctx.updateRoutine&&s.routineId){const r=S.routines.find(x=>x.id===s.routineId);if(r)r.exercises=s.exercises.map(e=>({...e,id:uid()}))}
    save();closeSheet();render();toast('Session saved')},
  'del-session':()=>{S.sessions=S.sessions.filter(x=>x.id!==ctx.s.id);save();closeSheet();render();toast('Deleted')},
  'new-routine':()=>{const r={id:uid(),name:'',days:[],exercises:[{id:uid(),group:'',name:'',sets:'',reps:'',note:'',band:[],bw:false}]};S.routines.push(r);planId=r.id;save();render();$('#r-name')?.focus()},
  'pick-routine':b=>{planId=b.dataset.id;render()},
  'toggle-day':b=>{const r=curRoutine(),n=+b.dataset.d;r.days=r.days.includes(n)?r.days.filter(x=>x!==n):[...r.days,n];save();render()},
  'ex-add':()=>{curRoutine().exercises.push({id:uid(),group:'',name:'',sets:'',reps:'',note:'',band:[],bw:false});save();render();const n=document.querySelectorAll('.ex-name');n[n.length-1]?.focus()},
  'ex-del':b=>{const r=curRoutine();r.exercises=r.exercises.filter(e=>e.id!==b.dataset.id);save();render()},
  'save-routine':()=>{const r=curRoutine();if(!r.name.trim()){$('#r-name').focus();toast('Give the routine a name');return}
    r.exercises=r.exercises.filter(e=>e.name.trim()||e.sets||e.reps||e.weight);save();render();toast(r.days.length?'Routine saved':'Saved · pick training days to see it on Today')},
  'dup-routine':()=>{const r=curRoutine(),c=JSON.parse(JSON.stringify(r));c.id=uid();c.name=(r.name||'Routine')+' copy';c.days=[];c.exercises.forEach(e=>e.id=uid());S.routines.push(c);planId=c.id;save();render();toast('Duplicated')},
  'del-routine':()=>{S.routines=S.routines.filter(r=>r.id!==planId);planId=null;save();render();toast('Routine deleted')},
  'goal':b=>{S.settings.goal=b.dataset.v;save();render()},
  'edit-setting':b=>settingSheet(b.dataset.key),
  'save-setting':()=>{const v=num($('#set-v').value,NaN);if(!isFinite(v)||v<0){toast('Enter a number');return}S.settings[ctx.key]=v;save();closeSheet();render();toast('Saved')},
  'range':b=>{chartRange=b.dataset.v;render()},
  'add-weight':()=>weightSheet(null),
  'edit-weight':b=>weightSheet(b.dataset.id),
  'save-weight':()=>{const lbs=num($('#w-lbs').value,NaN),date=$('#w-date').value||todayKey();if(!isFinite(lbs)||lbs<=0){$('#w-lbs').focus();toast('Enter your weight');return}
    if(ctx.id){Object.assign(S.weights.find(x=>x.id===ctx.id),{lbs,date})}
    else{const same=S.weights.find(x=>x.date===date);if(same)same.lbs=lbs;else S.weights.push({id:uid(),date,lbs})}
    save();closeSheet();render();toast('Weight saved')},
  'del-weight':()=>{S.weights=S.weights.filter(x=>x.id!==ctx.id);save();closeSheet();render();toast('Deleted')},
  'backup':()=>{const txt=JSON.stringify({app:'lift-fuel',v:1,exported:new Date().toISOString(),data:S});
    const fallback=()=>{S.lastBackup=Date.now();save();openSheet(`<h2>Backup</h2><div class="hint">Select all of this text, copy it, and keep it in Notes.</div><textarea class="in" id="b-text" style="min-height:200px" readonly>${esc(txt)}</textarea>`,'#b-text')};
    try{navigator.clipboard.writeText(txt).then(()=>{S.lastBackup=Date.now();save();render();toast('Backup copied')},fallback)}catch(e){fallback()}},
  'restore':restoreSheet,
  'do-restore':()=>{try{const o=JSON.parse($('#r-text').value.trim());const d=o&&o.data?o.data:o;if(!d||!d.settings)throw 0;S=normalize(d);planId=null;save();closeSheet();render();toast('Backup restored')}
    catch(e){$('#r-err').textContent="That doesn't look like a backup from this app. Paste the full text you copied.";const b=document.querySelector('[data-act="do-restore"]');delete b.dataset.armed;b.textContent=b.dataset.orig||'Restore'}},
  'erase':()=>{S=defaults();planId=null;save();render();toast('All data erased')},
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){tab=t.dataset.tab;history.replaceState(null,'','#'+tab);if(tab==='today'&&followToday)viewDate=todayKey();render();scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(!armed(b))return;
  A[b.dataset.act]?.(b);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.closest('.pill'))fitPill(el);
  if(el.id==='r-name'){const r=curRoutine();r.name=el.value;save();const c=document.querySelector('.chip.on');if(c)c.textContent=el.value||'Untitled';return}
  if(el.dataset.wr){const[ei,si]=el.dataset.wr.split(':').map(Number);const x=S.active?.exercises[ei]?.sets[si];if(x){x.reps=el.value;save()}return}
  if(el.dataset.ex){const r=curRoutine(),ex=r.exercises.find(x=>x.id===el.dataset.ex);if(ex){ex[el.dataset.f]=el.value;save()}return}
  if(el.dataset.sx){const ex=ctx.s.exercises.find(x=>x.id===el.dataset.sx);if(ex)ex[el.dataset.f]=el.value;return}
  if(el.id==='s-steps')updStepsHint();
  if(el.id==='x-min'){$('#x-est').innerHTML=estHtml(estimateKcal(num(el.value)))}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='x-routine'){readSessionForm();const r=S.routines.find(x=>x.id===el.value);ctx.s.routineId=el.value;
    if(r){ctx.s.name=r.name;ctx.s.exercises=r.exercises.map(x=>({...x,id:uid()}));if(!num(ctx.s.minutes))ctx.s.minutes=estMinutes(r)||''}
    drawSession()}
  if(el.id==='r-file'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{$('#r-text').value=fr.result};fr.readAsText(el.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){S=load();if(followToday&&viewDate!==todayKey())viewDate=todayKey();if($('#sheet').hidden)render();if(S.active&&woOpen&&!woFinish)renderWO()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['today','plan','log','progress'].includes(h)&&h!==tab){tab=h;render()}});

/* Health sync: an iPhone Shortcut opens the app as ?steps=1234 (optional &date=YYYY-MM-DD) */
function applyHealthParams(){
  let p;try{p=new URLSearchParams(location.search)}catch(e){return}
  const keys=['steps','ysteps','kcal','protein','ykcal','yprotein'];if(!keys.some(k=>p.has(k)))return;
  const date=/^\d{4}-\d{2}-\d{2}$/.test(p.get('date')||'')?p.get('date'):todayKey(),yday=addDays(date,-1),now=Date.now();
  const v=k=>{const n=Math.round(num(p.get(k),NaN));return isFinite(n)&&n>=0?n:null};const msg=[];
  const setSteps=(k,n)=>{const d=ensureDay(k);d.steps=n;d.stepsSyncedAt=now};
  const setFood=(k,kc,pr)=>{const d=ensureDay(k);if(kc===0&&!pr&&!d.health){return}d.health={kcal:kc??0,protein:pr??0,at:now}};
  if(v('steps')!=null){setSteps(date,v('steps'));msg.push(`${fmt(v('steps'))} steps`)}
  if(v('ysteps')!=null)setSteps(yday,v('ysteps'));
  if(v('kcal')!=null||v('protein')!=null){setFood(date,v('kcal'),v('protein'));if(v('kcal'))msg.push(`${fmt(v('kcal'))} kcal`)}
  if(v('ykcal')!=null||v('yprotein')!=null)setFood(yday,v('ykcal'),v('yprotein'));
  save();setTimeout(()=>toast(msg.length?'Synced '+msg.join(' · '):'Synced from Health'),300);
  try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
}
applyHealthParams();
render();
renderWO();
